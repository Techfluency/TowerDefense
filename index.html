<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      BOLT-022: Mobile viewport meta tag.
      - initial-scale=1: no zoom on load
      - maximum-scale=1: prevent pinch-to-zoom on the page (game handles its own camera zoom)
      - user-scalable=no: explicit zoom lock for older mobile browsers
      - viewport-fit=cover: extend into notch/safe areas on modern phones
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Random Gen Tower Defense</title>
    <style>
      /* Remove all margin/padding so the Phaser canvas fills the viewport.
       * Background is black to match the game's default clear color and
       * prevent a white flash on load. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #1a1a2e;
        overflow: hidden;
        /* BOLT-022: Prevent pull-to-refresh and overscroll bounce on mobile.
         * touch-action: none prevents all default touch behaviors on the body,
         * so the game canvas has full control over touch interpretation. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /* Prevent text selection during gameplay on mobile. */
        -webkit-user-select: none;
        user-select: none;
        /* Prevent tap highlight on mobile WebKit browsers. */
        -webkit-tap-highlight-color: transparent;
      }
      #game-container {
        /* Fill the visible viewport. Phaser's Scale.CENTER_BOTH handles
         * canvas centering via margins - no flex centering needed. */
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
      }
      /* BOLT-022: Prevent the Phaser canvas from being dragged or
       * triggering default touch behaviors. */
      canvas {
        touch-action: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <!--
      Phaser appends its canvas element to this container.
      The container is centered in the viewport so the game
      canvas appears centered regardless of window size.
    -->
    <div id="game-container"></div>

    <!-- Vite injects the bundled entry point here. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
